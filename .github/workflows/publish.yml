name: 예약 게시

on:
  schedule:
    # 한국 시간 월~토 07:05~22:35, 30분마다. GitHub 예약 실행은 늦거나 빠질 때가 있어서 자주 돌린다.
    # 각 실행은 예약 60분 전부터 맡은 글을 예약 시각까지 기다렸다가 올리고, 맡을 글이 없으면 바로 끝난다.
    # 같은 글이 두 번 올라가지 않게: 실행은 한 번에 하나만(concurrency), 올리기 직전에 원격 queue.json 과 계정 최근 게시물 확인.
    - cron: "5,35 22,23 * * 0-5" # 07:05~08:35 (UTC 전날 22:05~23:35)
    - cron: "5,35 0-13 * * 1-6" # 09:05~22:35
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run(미리보기) / check(연결 확인) / verify(최근 3일 글 비교 검사) / post(실제 게시)"
        type: choice
        options: [dry-run, check, verify, post]
        default: dry-run
      now:
        description: "미리보기용 시각 (예: 2026-10-19T11:05:00+09:00, 비우면 지금)"
        required: false
        default: ""

permissions:
  contents: write # 게시 결과를 posts/queue.json, blogger/queue.json 에 기록하려고 필요
  issues: write # 대기열 부족·게시 실패 알림 이슈를 만들려고 필요

# 실행이 동시에 두 개 돌지 않게 한다. 앞 실행이 기다리는 중이면 다음 실행은 끝날 때까지 대기.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 구글 블로그 (네이버 새 글 확인 + 승인된 글을 예약 시각에 게시)
        id: blogger
        continue-on-error: true
        env:
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          NOW: ${{ inputs.now }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: node scripts/blogger.mjs "--$MODE"
      - name: 게시
        id: publish
        env:
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          NOW: ${{ inputs.now }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_TOKEN_EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }}
          THREADS_TOKEN_EXPIRES: ${{ vars.THREADS_TOKEN_EXPIRES }}
        run: node scripts/publish.mjs "--$MODE"
      - name: 알림 이슈
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'post')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: node scripts/notify.mjs
      - name: 카카오 알림
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'post')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          NOTIFY_LABEL: 예약 게시(사진·스레드)
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: node scripts/kakao-notify.mjs
      - name: 카카오 알림 (구글 블로그)
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'post')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH_OUTCOME: ${{ steps.blogger.outcome }}
          NOTIFY_LABEL: 구글 블로그
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: node scripts/kakao-notify.mjs .kakao-events-blogger.json
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/queue.json blogger/queue.json
          # 기다리는 사이 main 이 바뀌었을 수 있어서 최신 내용 위에 얹어서 올린다
          git diff --cached --quiet || (git commit -m "게시 결과 기록" && git pull --rebase origin main && git push)
