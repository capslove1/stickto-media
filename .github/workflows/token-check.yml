name: 토큰 점검

on:
  schedule:
    # 매일 한국 시간 09:10 (UTC 00:10). 카카오 토큰 갱신(매일, 주 1회 이상 보장) + 만료 임박 토큰 카톡 알림.
    # 카카오 갱신이 실패하면 이 실행이 실패로 끝나고, GitHub 가 메일로 알려 준다.
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "시험 메시지도 보내기"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 토큰 점검
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IG_TOKEN_EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }}
          THREADS_TOKEN_EXPIRES: ${{ vars.THREADS_TOKEN_EXPIRES }}
          GH_SECRETS_PAT_EXPIRES: ${{ vars.GH_SECRETS_PAT_EXPIRES }}
          FB_DATA_ACCESS_EXPIRES: ${{ vars.FB_DATA_ACCESS_EXPIRES }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          KAKAO_TEST: ${{ inputs.test }}
        run: node scripts/token-check.mjs
