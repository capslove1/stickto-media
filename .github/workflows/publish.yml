name: 예약 게시

on:
  schedule:
    # 한국 시간 월~토. 예약 시각은 기준 시각 앞뒤 15분 안에서 흩어져 있고,
    # 스크립트가 예약 시각까지 기다렸다가 올린다 (GitHub 사정으로 늦게 실행될 수 있음)
    - cron: "55 22 * * 0-5" # 07:55 → 스레드 일상 08:15~08:45 (UTC 전날 22:55)
    - cron: "25 2 * * 1-6" # 11:25 → 스레드 시공 글 11:45~12:15
    - cron: "25 10 * * 1-6" # 19:25 → 인스타 사진·릴스 19:45~20:15
    - cron: "25 11 * * 1-6" # 20:25 → 스레드 일상 20:45~21:15
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run(미리보기) / check(연결 확인) / post(실제 게시)"
        type: choice
        options: [dry-run, check, post]
        default: dry-run
      now:
        description: "미리보기용 시각 (예: 2026-10-19T11:05:00+09:00, 비우면 지금)"
        required: false
        default: ""

permissions:
  contents: write # 게시 결과를 queue.json 에 기록하려고 필요
  issues: write # 대기열 부족·게시 실패 알림 이슈를 만들려고 필요

# 실행이 동시에 두 개 돌지 않게 한다. 앞 실행이 기다리는 중이면 다음 실행은 끝날 때까지 대기.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 게시
        id: publish
        env:
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          NOW: ${{ inputs.now }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_TOKEN_EXPIRES: ${{ vars.IG_TOKEN_EXPIRES }}
          THREADS_TOKEN_EXPIRES: ${{ vars.THREADS_TOKEN_EXPIRES }}
        run: node scripts/publish.mjs "--$MODE"
      - name: 알림 이슈
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'post')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: node scripts/notify.mjs
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/queue.json
          # 기다리는 사이 main 이 바뀌었을 수 있어서 최신 내용 위에 얹어서 올린다
          git diff --cached --quiet || (git commit -m "게시 결과 기록" && git pull --rebase origin main && git push)
